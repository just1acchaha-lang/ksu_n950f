version: 2.1
jobs:
  compile:
    docker:
      - image: ubuntu:20.04
    steps:
      - run:
          command: |
            apt-get -y update && apt-get -y upgrade && apt-get -y install bc build-essential zip curl libstdc++6 git wget gcc clang libssl-dev rsync flex bison cpio libncurses5 curl python-is-python3
            git config --global user.name "just1acchaha-lang"
            git config --global user.email "just1acchaha@gmail.com"
            git config --global color.ui false
            git clone https://github.com/akhilnarang/scripts && cd scripts && bash setup/android_build_env.sh && cd ..
            mkdir predator
            cd predator
            wget https://raw.githubusercontent.com/just1acchaha-lang/android_kernel_samsung_universal8895/refs/heads/lineage-20.0/build_menu
            bash build_menu
workflows:
  version: 2.1
  cooking:
    jobs:
      - compile